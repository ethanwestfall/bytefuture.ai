<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supported Models — Token Station</title>
  <meta name="description" content="Live catalog of every model available on Token Station — fetched on the fly from the gateway API, categorized by modality." />
  <link rel="canonical" href="https://tokens.bytefuture.ai/models.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Google tag (gtag.js) — GA4 + Google Ads -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQ0EX9QGK6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KQ0EX9QGK6');
  </script>

  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#faf9f5; color:#18181b; font-family:'DM Sans',sans-serif; }
    a { color:#2563EB; text-decoration:none; }
    .wrap { max-width:1180px; margin:0 auto; padding:48px 24px 96px; }
    h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(28px,4vw,44px); font-weight:700; letter-spacing:-0.03em; margin:0 0 10px; }
    .sub { color:#71717a; font-size:16px; line-height:1.6; margin:0 0 24px; max-width:680px; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
    #search { flex:1; min-width:220px; padding:10px 14px; border:1px solid #e4e4e7; border-radius:10px; font-size:14px; font-family:inherit; background:#fff; }
    .chip { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; padding:7px 12px; border-radius:50px; border:1px solid #e4e4e7; background:#fff; color:#52525b; cursor:pointer; }
    .chip[aria-pressed="true"] { background:#2563EB; border-color:#2563EB; color:#fff; }
    .summary { font-size:13px; color:#71717a; margin-bottom:16px; font-family:'JetBrains Mono',monospace; }

    /* Card grid — one card per model */
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(264px, 1fr)); gap:16px; }
    .mcard { background:#fff; border:1px solid #e4e4e7; border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; transition:border-color .2s, transform .2s, box-shadow .2s; }
    .mcard:hover { border-color:#2563EB; transform:translateY(-2px); box-shadow:0 8px 24px rgba(24,24,27,0.06); }
    .mtop { display:flex; align-items:center; gap:10px; }
    .logo { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid #e4e4e7; flex-shrink:0; overflow:hidden; }
    .logo img { width:22px; height:22px; object-fit:contain; }
    .glyph { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; line-height:1; }
    .mprov { font-size:12px; color:#52525b; font-weight:500; }
    .mname { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; color:#18181b; word-break:break-word; line-height:1.45; }
    .mods { display:flex; flex-wrap:wrap; gap:4px; }
    .badge { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600; padding:2px 7px; border-radius:5px; background:#eef4ff; color:#2563EB; border:1px solid rgba(37,99,235,0.18); }
    .badge.media { background:#f0fdfa; color:#0D9488; border-color:rgba(13,148,136,0.20); }
    .mfoot { display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:11px; border-top:1px solid #f4f4f5; font-family:'JetBrains Mono',monospace; font-size:11px; color:#71717a; }
    .price .free { color:#0D9488; font-weight:600; }
    .state { padding:48px; text-align:center; color:#71717a; }
  </style>
</head>
<body>
  <header style="position:sticky; top:0; z-index:50; background:rgba(250,249,245,0.88); backdrop-filter:blur(12px); border-bottom:1px solid #e4e4e7;">
    <div style="max-width:1180px; margin:0 auto; padding:0 24px; height:60px; display:flex; align-items:center; justify-content:space-between;">
      <a href="index.html" style="display:flex; align-items:center; gap:10px; color:inherit;">
        <svg width="26" height="28" viewBox="0 0 28 32" fill="none" aria-label="Token Station logo" role="img">
          <path d="M14 2L26 7V17C26 23 21 28 14 30C7 28 2 23 2 17V7L14 2Z" fill="#2563eb" fill-opacity="0.15" stroke="#60a5fa" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="3.5" fill="#60a5fa"/>
          <path d="M14 10.5V6M17.5 15.5L21 18M10.5 15.5L7 18" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="14" cy="5" r="1.5" fill="#a78bfa"/>
          <circle cx="22" cy="19" r="1.5" fill="#34d399"/>
          <circle cx="6" cy="19" r="1.5" fill="#fb923c"/>
        </svg>
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; letter-spacing:-0.01em;">Token Station</span>
      </a>
      <a href="https://models.bytefuture.ai/signup" style="background:#2563EB; color:#faf9f5; border-radius:50px; padding:9px 18px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; text-decoration:none;" onclick="gtag('event','cta_click',{label:'models_start_free'}); gtag('event','begin_checkout',{label:'models_start_free'});">Start free</a>
    </div>
  </header>

  <div class="wrap">
    <h1>Supported Models</h1>
    <p class="sub">The full catalog, fetched live from the gateway — list, provider, context window, price, and modality are always current.</p>

    <div class="controls">
      <input id="search" type="search" placeholder="Search models or providers…" aria-label="Search models" />
      <div id="chips" role="group" aria-label="Filter by modality"></div>
    </div>

    <div class="summary" id="summary"></div>
    <div id="out"><div class="state">Loading models…</div></div>
  </div>

  <script>
  // ── Config ────────────────────────────────────────────────────────────────
  // Public, CORS-open (access-control-allow-origin: *), no API key required.
  // Do NOT use /v1/models here — it requires Authorization: Bearer <key>.
  const API = 'https://models.bytefuture.ai/api/models';
  const FILTERS = ['Chat', 'Multimodal', 'Image', 'Video', 'TTS', 'ASR', 'Embeddings', 'Music'];

  // ── Provider theming (name · color · glyph) ─────────────────────────────────
  const PROVIDERS = {
    "openai":{"name":"OpenAI","color":"#10A37F","glyph":"O"},
    "anthropic":{"name":"Anthropic","color":"#D97757","glyph":"A"},
    "aws-claude":{"name":"AWS · Claude","color":"#FF9900","glyph":"A"},
    "aws-bedrock":{"name":"AWS Bedrock","color":"#FF9900","glyph":"B"},
    "aws-bedrock-openai":{"name":"AWS Bedrock · OpenAI","color":"#FF9900","glyph":"B"},
    "gemini":{"name":"Google Gemini","color":"#4F8DFA","glyph":"G"},
    "groq":{"name":"Groq","color":"#F55036","glyph":"G"},
    "bailian":{"name":"Alibaba Bailian","color":"#615CED","glyph":"百"},
    "xai":{"name":"xAI","color":"#18181b","glyph":"X"},
    "byteplus":{"name":"BytePlus","color":"#3370FF","glyph":"B"},
    "glm":{"name":"Zhipu GLM","color":"#9B7BF7","glyph":"智"},
    "glm-coding":{"name":"Zhipu GLM · Coding","color":"#9B7BF7","glyph":"智"},
    "nvidia-nim":{"name":"NVIDIA NIM","color":"#76B900","glyph":"N"},
    "mistral":{"name":"Mistral","color":"#FF7000","glyph":"M"},
    "kling":{"name":"Kling","color":"#FF3D6E","glyph":"K"},
    "elevenlabs":{"name":"ElevenLabs","color":"#A78BFA","glyph":"11"},
    "minimax":{"name":"MiniMax","color":"#F472B6","glyph":"M"},
    "minimax-media":{"name":"MiniMax Media","color":"#F472B6","glyph":"M"},
    "kimi":{"name":"Moonshot Kimi","color":"#5B8DEE","glyph":"月"},
    "deepseek":{"name":"DeepSeek","color":"#4D6BFE","glyph":"D"},
    "openai-codex":{"name":"OpenAI Codex","color":"#10A37F","glyph":"C"},
    "claude-code":{"name":"Claude Code","color":"#D97757","glyph":"C"},
    "github-copilot":{"name":"GitHub Copilot","color":"#6E40C9","glyph":"GH"},
    "azure-foundry":{"name":"Azure AI Foundry","color":"#0078D4","glyph":"Az"},
    "azure-speech":{"name":"Azure Speech","color":"#0078D4","glyph":"Az"},
    "ideogram":{"name":"Ideogram","color":"#1C1C1C","glyph":"I"},
    "reve":{"name":"Reve","color":"#111827","glyph":"R"},
    "xiaomi":{"name":"Xiaomi","color":"#FF6900","glyph":"Mi"}
  };
  const PALETTE = ['#2563EB','#0D9488','#7C3AED','#DB2777','#EA580C','#0891B2','#65A30D','#9333EA','#E11D48','#4F46E5'];
  function providerStyle(key) {
    if (PROVIDERS[key]) return PROVIDERS[key];
    let h = 0; for (const c of (key || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const name = (key || 'unknown').replace(/[-_]/g, ' ').replace(/\b\w/g, m => m.toUpperCase());
    const glyph = ((key || '?').replace(/[^a-z0-9]/gi, '')[0] || '?').toUpperCase();
    return { name, color: PALETTE[h % PALETTE.length], glyph };
  }
  // Darken a too-light brand colour so the glyph stays legible on a white chip.
  function guard(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    return (0.299*r + 0.587*g + 0.114*b) > 200 ? '#18181b' : hex;
  }

  // ── Provider logos (real SVGs in /logos) ────────────────────────────────────
  // Provider key → brand key (several providers share one brand mark).
  const BRAND = {
    "openai":"openai","openai-codex":"openai","aws-bedrock-openai":"openai",
    "anthropic":"anthropic","claude-code":"anthropic","aws-claude":"anthropic",
    "gemini":"gemini","nvidia-nim":"nvidia","mistral":"mistral","elevenlabs":"elevenlabs",
    "deepseek":"deepseek","github-copilot":"githubcopilot","xai":"xai","xiaomi":"xiaomi",
    "bailian":"qwen","minimax":"minimax","minimax-media":"minimax",
    "azure-foundry":"azure","azure-speech":"azure","aws-bedrock":"aws",
    "groq":"groq","kimi":"kimi","byteplus":"byteplus","glm":"glm","glm-coding":"glm",
    "kling":"kling","ideogram":"ideogram","reve":"reve","gmi":"gmi",
    "deepinfra":"deepinfra","longcat":"longcat"
  };
  // brand -> logo filename in /logos (SVG unless noted). Drop a file + add a line here.
  const LOGO = {
    openai:"openai.svg", anthropic:"anthropic.svg", gemini:"gemini.svg", nvidia:"nvidia.svg",
    mistral:"mistral.svg", elevenlabs:"elevenlabs.svg", deepseek:"deepseek.svg",
    githubcopilot:"githubcopilot.svg", xai:"xai.svg", xiaomi:"xiaomi.svg", qwen:"qwen.svg",
    minimax:"minimax.svg", azure:"azure.svg", aws:"aws.svg", groq:"groq.svg", kimi:"kimi.svg",
    glm:"glm.svg", reve:"reve.svg", longcat:"longcat.svg", deepinfra:"deepinfra.svg",
    kling:"kling.svg", byteplus:"byteplus.svg", gmi:"gmi.svg", ideogram:"ideogram.png"
  };
  function logoMarkup(key, st) {
    const f = LOGO[BRAND[key] || key];
    if (f) return `<img src="logos/${f}" alt="${esc(st.name)} logo" loading="lazy">`;
    return `<span class="glyph" style="color:${guard(st.color)}">${esc(st.glyph)}</span>`;
  }

  // ── Modality mapping (from the API's real `modalities` field) ────────────────
  //   text → Chat ; multimodal → Chat + Multimodal (text ∪ multimodal = all LLMs)
  const MEDIA = { image:'Image', video:'Video', tts:'TTS', asr:'ASR', embedding:'Embeddings', music:'Music' };
  function displayMods(raw) {
    const r = new Set((Array.isArray(raw) ? raw : [raw]).map(x => String(x).toLowerCase()));
    const out = [];
    if (r.has('text') || r.has('multimodal')) out.push('Chat');
    if (r.has('multimodal')) out.push('Multimodal');
    for (const k in MEDIA) if (r.has(k)) out.push(MEDIA[k]);
    if (!out.length) out.push('Other');
    return out;
  }
  const isMedia = tag => Object.values(MEDIA).includes(tag);

  // ── Formatting ──────────────────────────────────────────────────────────────
  const money = v => '$' + (v / 1e6).toLocaleString(undefined, { maximumFractionDigits: 2 });
  function priceCell(m) {
    const i = m.input_price_per_million || 0, o = m.output_price_per_million || 0;
    if (i === 0 && o === 0) return '<span class="free">Free</span>';
    return money(i) + ' / ' + money(o);
  }
  function ctx(n) {
    if (!n) return '—';
    if (n >= 1e6) return (n / 1e6) + 'M';
    if (n >= 1e3) return (n / 1e3) + 'K';
    return String(n);
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── State + render ───────────────────────────────────────────────────────────
  let MODELS = [], activeFilter = 'All', query = '';

  function card(m) {
    const st = providerStyle(m.provider);
    const short = m.name.includes('/') ? m.name.slice(m.name.indexOf('/') + 1) : m.name;
    const cx = ctx(m.context_size);
    return `
      <div class="mcard">
        <div class="mtop">
          <div class="logo">${logoMarkup(m.provider, st)}</div>
          <div class="mprov">${esc(st.name)}</div>
        </div>
        <div class="mname" title="${esc(m.name)}">${esc(short)}</div>
        <div class="mods">${m._mods.map(x => `<span class="badge${isMedia(x) ? ' media' : ''}">${x}</span>`).join('')}</div>
        <div class="mfoot">
          <span>${cx === '—' ? '' : cx + ' ctx'}</span>
          <span class="price">${priceCell(m)}</span>
        </div>
      </div>`;
  }

  function render() {
    const q = query.trim().toLowerCase();
    const rows = MODELS.filter(m => {
      const okF = activeFilter === 'All' || m._mods.includes(activeFilter);
      const okQ = !q || m.name.toLowerCase().includes(q) || (m.provider || '').toLowerCase().includes(q);
      return okF && okQ;
    });
    const providers = new Set(rows.map(m => m.provider));
    document.getElementById('summary').textContent =
      `Showing ${rows.length} of ${MODELS.length} models · ${providers.size} providers · live from /api/models`;
    document.getElementById('out').innerHTML = rows.length
      ? `<div class="grid">${rows.map(card).join('')}</div>`
      : '<div class="state">No models match.</div>';
  }

  function buildChips() {
    const present = new Set(MODELS.flatMap(m => m._mods));
    const el = document.getElementById('chips');
    el.innerHTML = '';
    ['All', ...FILTERS.filter(f => present.has(f))].forEach(label => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = label;
      b.setAttribute('aria-pressed', label === 'All');
      b.onclick = () => {
        activeFilter = label;
        [...el.children].forEach(c => c.setAttribute('aria-pressed', c === b));
        gtag('event', 'models_filter', { label });
        render();
      };
      el.appendChild(b);
    });
  }

  async function load() {
    try {
      const res = await fetch(API, { headers: { accept: 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.data || []);
      MODELS = list
        .map(m => ({ ...m, _mods: displayMods(m.modalities) }))
        .sort((a, b) => (a.provider || '').localeCompare(b.provider || '') || a.name.localeCompare(b.name));
      buildChips();
      render();
    } catch (e) {
      document.getElementById('out').innerHTML =
        `<div class="state">Couldn't load the live catalog (${esc(e.message)}).<br>The API may be unreachable from your network.</div>`;
    }
  }

  document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });
  load();
  </script>
</body>
</html>

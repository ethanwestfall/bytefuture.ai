<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>configure-open-webui-with-token-station-cover</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,400&amp;display=swap');
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="rgb(24,24,27)" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="wash1" gradientUnits="userSpaceOnUse" cx="1020" cy="80" r="480">
      <stop offset="0" stop-color="rgb(37,99,235)" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="rgb(13,148,136)" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="rgb(0,0,0)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" gradientUnits="userSpaceOnUse" cx="120" cy="640" r="420">
      <stop offset="0" stop-color="rgb(37,99,235)" stop-opacity="0.10"/>
      <stop offset="0.7" stop-color="rgb(0,0,0)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#faf9f5"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="560" y="-400" width="960" height="960" fill="url(#wash1)"/>
  <rect x="-300" y="260" width="840" height="840" fill="url(#wash2)"/>

  <text x="72" y="81" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="600" letter-spacing="2.72px" fill="rgb(13,148,136)">OPEN WEBUI &#183; TOKEN STATION &#183; SETUP</text>

  <text x="72" y="176" font-family="'Space Grotesk', sans-serif" font-size="70" font-weight="700" letter-spacing="-2.45px" fill="rgb(37,99,235)">Open WebUI,</text>
  <text x="72" y="248.55" font-family="'Space Grotesk', sans-serif" font-size="70" font-weight="700" letter-spacing="-2.45px" fill="rgb(24,24,27)">wired in.</text>
  <text x="72" y="316.09" font-family="'Source Serif 4', serif" font-size="36" font-weight="400" font-style="italic" letter-spacing="-0.36px" fill="rgb(82,82,91)">Any model, one dropdown.</text>

  <!-- model-selector panel mockup -->
  <rect x="648" y="96" width="480" height="294" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>

  <text x="676" y="142" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="1.5px" fill="rgb(113,113,122)">MODEL SELECTOR &#183; AUTO-DETECTED</text>

  <rect x="676" y="156" width="424" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="692" y="184" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="rgb(24,24,27)">anthropic/claude-fable-5</text>
  <text x="1086" y="184" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgb(13,148,136)">PUBLIC</text>

  <rect x="676" y="210" width="424" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="692" y="238" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="rgb(24,24,27)">openai/gpt-5.6-sol</text>
  <text x="1086" y="238" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgb(13,148,136)">PUBLIC</text>

  <rect x="676" y="264" width="424" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="692" y="292" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="rgb(24,24,27)">xai/grok-4.6</text>
  <text x="1086" y="292" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgb(13,148,136)">PUBLIC</text>

  <rect x="676" y="318" width="424" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="692" y="346" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" fill="rgb(24,24,27)">kimi/kimi-k3</text>
  <text x="1086" y="346" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgb(13,148,136)">PUBLIC</text>

  <!-- bottom chip row -->
  <rect x="72.5" y="510.5" width="180" height="55" rx="27.5" fill="rgb(255,255,255)" stroke="rgb(228,228,231)" stroke-width="1"/>
  <text x="99" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24,24,27)">Open WebUI</text>

  <rect x="266.5" y="510.5" width="210" height="55" rx="27.5" fill="rgb(255,255,255)" stroke="rgb(228,228,231)" stroke-width="1"/>
  <text x="293" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24,24,27)">Token Station</text>

  <rect x="490.5" y="510.5" width="150" height="55" rx="27.5" fill="rgb(240,253,250)" stroke="rgba(13,148,136,0.4)" stroke-width="1"/>
  <text x="517" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(13,148,136)">20+ models</text>

  <svg x="949.08" y="526" width="40" height="40" viewBox="0 0 32 32" fill="none">
    <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"></rect>
    <circle cx="12" cy="16" r="3.4" fill="#2563EB"></circle>
    <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"></circle>
    <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"></path>
  </svg>
  <text x="1002.08" y="554" font-family="'Space Grotesk', sans-serif" font-size="23" font-weight="600" fill="rgb(82,82,91)">ByteFuture</text>
</svg>

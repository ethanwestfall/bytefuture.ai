<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#faf9f5; font-family:'Space Grotesk',sans-serif; overflow:hidden; position:relative; }

  .grid {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(24,24,27,0.07) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }
  .wash {
    position:absolute; top:-220px; right:-160px; width:680px; height:680px; border-radius:50%;
    background: radial-gradient(circle, rgba(13,148,136,0.16) 0%, rgba(37,99,235,0.08) 45%, transparent 70%);
  }

  .routes { position:absolute; right:50px; top:118px; width:470px; height:250px; opacity:0.98; }

  .content { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }

  .kicker {
    font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;
    letter-spacing:0.16em; text-transform:uppercase; color:#0D9488; margin-bottom:24px;
  }

  h1 { font-size:88px; font-weight:700; letter-spacing:-0.035em; line-height:1.02; color:#18181b; max-width:640px; }
  h1 .sub { display:block; font-family:'Source Serif 4',serif; font-style:italic; font-weight:400; font-size:34px; letter-spacing:-0.01em; color:#52525b; margin-top:22px; }

  .bottom { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; }
  .chips { display:flex; gap:14px; align-items:center; }
  .chip {
    background:#ffffff; border:1.5px solid #e4e4e7; border-radius:50px; padding:13px 26px;
    font-size:22px; font-weight:600; color:#18181b;
  }
  .chip.accent { border-color:rgba(13,148,136,0.40); color:#0D9488; background:#f0fdfa; }

  .brand { display:flex; align-items:center; gap:13px; }
  .brand span { font-size:23px; font-weight:600; color:#52525b; }

  .node-label { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; fill:#18181b; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>

  <svg class="routes" viewBox="0 0 470 250" fill="none">
    <path d="M60 125 C 170 125, 190 34,  310 34"  stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M60 125 C 170 125, 190 125, 310 125" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M60 125 C 170 125, 190 216, 310 216" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

    <circle cx="60" cy="125" r="28" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2.4"/>
    <circle cx="60" cy="125" r="8.5" fill="#2563EB"/>

    <circle cx="310" cy="34"  r="14" fill="none" stroke="#0D9488" stroke-width="3"/>
    <circle cx="310" cy="125" r="14" fill="none" stroke="#0D9488" stroke-width="3"/>
    <circle cx="310" cy="216" r="14" fill="none" stroke="#0D9488" stroke-width="3"/>

    <text x="336" y="41"  class="node-label">gpt-5.5</text>
    <text x="336" y="132" class="node-label">grok-build</text>
    <text x="336" y="223" class="node-label">glm-5.2</text>
  </svg>

  <div class="content">
    <div class="kicker">OpenClaw &middot; Token Station &middot; Any model</div>
    <h1>One command.<br>Any model.
      <span class="sub">250+ models, 21 providers, one endpoint.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">OpenClaw</div>
        <div class="chip">21 providers</div>
        <div class="chip accent">on Token Station</div>
      </div>
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"/>
          <circle cx="12" cy="16" r="3.4" fill="#2563EB"/>
          <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"/>
          <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>ByteFuture</span>
      </div>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>gpt-5-6-token-station-cover</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,400&amp;display=swap');
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="rgb(24,24,27)" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="wash1" gradientUnits="userSpaceOnUse" cx="1020" cy="120" r="480.83">
      <stop offset="0" stop-color="rgb(37,99,235)" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="rgb(13,148,136)" stop-opacity="0.08"/>
      <stop offset="0.7" stop-color="rgb(0,0,0)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#faf9f5"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  <rect x="680" y="-220" width="680" height="680" fill="url(#wash1)"/>
  <svg x="700" y="118" width="430" height="250" viewBox="0 0 430 250" fill="none" opacity="0.98">
    <!-- links from single endpoint to three routes -->
    <path d="M60 125 C 170 125, 190 34,  300 34" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"></path>
    <path d="M60 125 C 170 125, 190 125, 300 125" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"></path>
    <path d="M60 125 C 170 125, 190 216, 300 216" stroke="#2563EB" stroke-width="4" stroke-linecap="round" opacity="0.55"></path>
    
    <!-- endpoint hub -->
    <circle cx="60" cy="125" r="28" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2.4"></circle>
    <circle cx="60" cy="125" r="8.5" fill="#2563EB"></circle>
    
    <!-- three variant nodes -->
    <circle cx="300" cy="34" r="14" fill="none" stroke="#0D9488" stroke-width="3"></circle>
    <circle cx="300" cy="125" r="14" fill="none" stroke="#0D9488" stroke-width="3"></circle>
    <circle cx="300" cy="216" r="14" fill="none" stroke="#0D9488" stroke-width="3"></circle>
    
    <text x="326" y="41" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600" fill="rgb(24, 24, 27)">Sol</text>
    <text x="326" y="132" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600" fill="rgb(24, 24, 27)">Terra</text>
    <text x="326" y="223" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="600" fill="rgb(24, 24, 27)">Luna</text>
  </svg>
  <text x="72" y="81" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="600" letter-spacing="2.72px" fill="rgb(13, 148, 136)">OPENAI · GPT-5.6 · CODING AGENTS</text>
  <text x="72" y="176" font-family="'Space Grotesk', sans-serif" font-size="78" font-weight="700" letter-spacing="-2.73px" fill="rgb(37, 99, 235)">GPT-5.6</text>
  <text x="359.67" y="176" font-family="'Space Grotesk', sans-serif" font-size="78" font-weight="700" letter-spacing="-2.73px" fill="rgb(24, 24, 27)">is now</text>
  <text x="72" y="255.55" font-family="'Space Grotesk', sans-serif" font-size="78" font-weight="700" letter-spacing="-2.73px" fill="rgb(24, 24, 27)">supported</text>
  <text x="72" y="323.09" font-family="'Source Serif 4', serif" font-size="38" font-weight="400" font-style="italic" letter-spacing="-0.38px" fill="rgb(82, 82, 91)">Sol, Terra, and Luna from one endpoint.</text>
  <rect x="72.5" y="510.5" width="85.61" height="55" rx="27.5" fill="rgb(255, 255, 255)" stroke="rgb(228, 228, 231)" stroke-width="1"/>
  <text x="99" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24, 24, 27)">Sol</text>
  <rect x="173.11" y="510.5" width="106.23" height="55" rx="27.5" fill="rgb(255, 255, 255)" stroke="rgb(228, 228, 231)" stroke-width="1"/>
  <text x="199.61" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24, 24, 27)">Terra</text>
  <rect x="294.34" y="510.5" width="104.7" height="55" rx="27.5" fill="rgb(255, 255, 255)" stroke="rgb(228, 228, 231)" stroke-width="1"/>
  <text x="320.84" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24, 24, 27)">Luna</text>
  <rect x="414.05" y="510.5" width="231.03" height="55" rx="27.5" fill="rgb(239, 244, 255)" stroke="rgba(37, 99, 235, 0.4)" stroke-width="1"/>
  <text x="440.55" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(37, 99, 235)">on Token Station</text>
  <svg x="949.08" y="526" width="40" height="40" viewBox="0 0 32 32" fill="none">
    <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"></rect>
    <circle cx="12" cy="16" r="3.4" fill="#2563EB"></circle>
    <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"></circle>
    <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"></path>
  </svg>
  <text x="1002.08" y="554" font-family="'Space Grotesk', sans-serif" font-size="23" font-weight="600" fill="rgb(82, 82, 91)">ByteFuture</text>

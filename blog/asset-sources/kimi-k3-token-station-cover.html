<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="_cover.css">

</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>
  <div class="wash2"></div>

    <h1>First into the<br><span class="hl">3-trillion</span> class.
      <span class="sub">2.8T parameters, free to try.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">Claude Code</div>
        <div class="chip">Codex</div>
        <div class="chip">OpenClaw</div>
        <div class="arrow">&rarr;</div>
        <div class="chip accent mono">kimi/kimi-k3</div>
      </div>
      <div class="brand"><span>ByteFuture</span></div>
    </div>
  </div>

</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#faf9f5; font-family:'Space Grotesk',sans-serif; overflow:hidden; position:relative; }

  .grid {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(24,24,27,0.07) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }
  .wash {
    position:absolute; top:-220px; right:-180px; width:680px; height:680px; border-radius:50%;
    background: radial-gradient(circle, rgba(13,148,136,0.16) 0%, rgba(37,99,235,0.10) 45%, transparent 70%);
  }
  .wash2 {
    position:absolute; bottom:-260px; left:-160px; width:600px; height:600px; border-radius:50%;
    background: radial-gradient(circle, rgba(37,99,235,0.10) 0%, transparent 65%);
  }

  .content { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }

  .kicker {
    font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;
    letter-spacing:0.18em; text-transform:uppercase; color:#0D9488; margin-bottom:26px;
  }

  h1 { font-size:80px; font-weight:700; letter-spacing:-0.035em; line-height:1.03; color:#18181b; max-width:660px; }
  h1 .hl { color:#0D9488; }
  h1 .sub { display:block; font-family:'Source Serif 4',serif; font-style:italic; font-weight:400; font-size:36px; letter-spacing:-0.01em; color:#52525b; margin-top:20px; }

  .tag {
    position:absolute; top:84px; right:72px; transform:rotate(-5deg);
    background:#0D9488; color:#faf9f5; border-radius:16px; padding:22px 28px 20px;
    box-shadow: 0 18px 44px rgba(13,148,136,0.32);
  }
  .tag::before {
    content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:18px; height:18px; border-radius:50%; background:#faf9f5; border:4px solid #0D9488;
  }
  .tag .lab { font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:rgba(250,249,245,0.7); margin-bottom:8px; text-align:center; }
  .tag .price { font-size:40px; font-weight:700; letter-spacing:-0.02em; text-align:center; }
  .tag .price span { color:#fde68a; }
  .tag .per { font-family:'JetBrains Mono',monospace; font-size:12px; color:rgba(250,249,245,0.7); text-align:center; margin-top:6px; }

  .bottom { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; }

  .chips { display:flex; gap:14px; align-items:center; }
  .chip {
    background:#ffffff; border:1.5px solid #e4e4e7; border-radius:50px; padding:13px 26px;
    font-size:22px; font-weight:600; color:#18181b;
  }
  .chip.accent { border-color:rgba(13,148,136,0.40); color:#0D9488; background:#f0fdfa; font-family:'JetBrains Mono',monospace; font-size:19px; }
  .arrow { font-size:26px; color:#a1a1aa; }

  .brand { display:flex; align-items:center; gap:13px; }
  .brand span { font-size:23px; font-weight:600; color:#52525b; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>
  <div class="wash2"></div>

  <div class="tag">
    <div class="lab">API Price / 1M tok</div>
    <div class="price">$3 <span>/</span> $15</div>
    <div class="per">$0.30 on a cache hit &middot; 1M ctx</div>
  </div>

  <div class="content">
    <div class="kicker">Kimi K3 &middot; on Token Station</div>
    <h1>First into the<br><span class="hl">3-trillion</span> class.
      <span class="sub">2.8T parameters, free to try.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">Claude Code</div>
        <div class="chip">Codex</div>
        <div class="chip">OpenClaw</div>
        <div class="arrow">&rarr;</div>
        <div class="chip accent">kimi/kimi-k3</div>
      </div>
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"/>
          <circle cx="12" cy="16" r="3.4" fill="#2563EB"/>
          <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"/>
          <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>ByteFuture</span>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_cover.css">
<style>
  /* ~/.codex/config.toml card, upper right, highlighting the one line that matters. */
  .card {
    position: absolute; top: 96px; right: 48px; transform: rotate(-4deg);
    background: var(--ink); color: var(--paper); border-radius: 16px; padding: 26px 30px;
    box-shadow: 0 18px 44px rgba(13, 148, 136, 0.28); width: 430px;
  }
  .card::before {
    content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 4px solid var(--ink);
  }
  .card .path { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #7d8590; margin-bottom: 16px; }
  .card .line { font-family: 'JetBrains Mono', monospace; font-size: 17px; margin-bottom: 10px; }
  .card .line .k { color: #7d8590; }
  .card .line .v { color: #ffffff; }
  .card .hl { background: rgba(13, 148, 136, 0.20); border-radius: 8px; padding: 8px 10px; margin: 4px -10px 10px; }
  .card .hl .v { color: #2dd4bf; }
  .card .check { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2dd4bf; margin-top: 6px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>

  <div class="card">
    <div class="path">~/.codex/config.toml</div>
    <div class="line"><span class="k">model_provider = </span><span class="v">"token_station"</span></div>
    <div class="hl line" style="margin-bottom:0;"><span class="k">wire_api = </span><span class="v">"responses"</span></div>
    <div class="check">&#10003; the value that has to be exact</div>
  </div>

  <div class="content">
    <div class="kicker">OpenAI Codex &middot; Token Station &middot; Responses API</div>
    <h1>One config line.<br>Any model.
      <span class="sub">The one value that has to be exact.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">Codex</div>
        <div class="chip">Responses API</div>
        <div class="chip accent">on Token Station</div>
      </div>
      <div class="brand"><span>ByteFuture</span></div>
    </div>
  </div>
</body>
</html>

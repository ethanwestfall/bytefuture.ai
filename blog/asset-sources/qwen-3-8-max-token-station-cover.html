<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_cover.css">
<style>
  h1 { font-size: 66px; line-height: 1.08; max-width: 600px; }

  /* Checkmark scorecard, upper right. */
  .rows { position: absolute; right: 48px; top: 130px; width: 430px; }
  .row {
    display: flex; align-items: center; gap: 14px; background: #ffffff; border: 1.5px solid var(--line);
    border-radius: 14px; padding: 16px 22px; margin-bottom: 14px;
  }
  .row.accent { background: var(--accent-bg); border-color: var(--accent); }
  .row .dot {
    width: 26px; height: 26px; border-radius: 50%; background: #c7d6f7; color: #2563EB;
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
  }
  .row.accent .dot { background: var(--accent); color: #ffffff; }
  .row .name { font-size: 22px; font-weight: 600; color: var(--ink); flex: 1; }
  .row.accent .name { color: var(--accent); }
  .row .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>

  <div class="rows">
    <div class="row"><div class="dot">&#10003;</div><div class="name">GPT-5.6</div></div>
    <div class="row"><div class="dot">&#10003;</div><div class="name">Kimi K3</div></div>
    <div class="row accent"><div class="dot">&#10003;</div><div class="name">Qwen 3.8-Max</div><div class="badge">Steadiest latency</div></div>
  </div>

  <div class="content">
    <div class="kicker">Alibaba &middot; Qwen 3.8-Max &middot; First look</div>
    <h1>No benchmarks yet.<br>We ran our own.
      <span class="sub">Three tasks, three models, all passed.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">3 tasks</div>
        <div class="chip">3 models</div>
        <div class="chip accent">all passed</div>
      </div>
      <div class="brand"><span>ByteFuture</span></div>
    </div>
  </div>
</body>
</html>

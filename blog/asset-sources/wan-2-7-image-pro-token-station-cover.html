<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#faf9f5; font-family:'Space Grotesk',sans-serif; overflow:hidden; position:relative; }

  .grid {
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(24,24,27,0.07) 1.2px, transparent 1.2px);
    background-size: 28px 28px;
  }
  .wash {
    position:absolute; top:-220px; right:-180px; width:680px; height:680px; border-radius:50%;
    background: radial-gradient(circle, rgba(13,148,136,0.16) 0%, rgba(37,99,235,0.10) 45%, transparent 70%);
  }
  .wash2 {
    position:absolute; bottom:-260px; left:-160px; width:600px; height:600px; border-radius:50%;
    background: radial-gradient(circle, rgba(37,99,235,0.10) 0%, transparent 65%);
  }

  .content { position:absolute; inset:0; padding:64px 72px; display:flex; flex-direction:column; }

  .kicker {
    font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:600;
    letter-spacing:0.16em; text-transform:uppercase; color:#0D9488; margin-bottom:26px;
  }

  h1 { font-size:68px; font-weight:700; letter-spacing:-0.035em; line-height:1.08; color:#18181b; max-width:600px; }
  h1 .hl { color:#0D9488; }
  h1 .sub { display:block; font-family:'Source Serif 4',serif; font-style:italic; font-weight:400; font-size:32px; letter-spacing:-0.01em; color:#52525b; margin-top:22px; }

  /* photo mosaic motif */
  .mosaic { position:absolute; top:130px; right:64px; width:400px; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .tile {
    position:relative; height:112px; border-radius:14px; border:1.5px solid #e4e4e7; overflow:hidden;
    display:flex; align-items:flex-end; box-shadow:0 10px 26px rgba(24,24,27,0.06);
  }
  .tile::before { content:''; position:absolute; inset:0; }
  .tile.t1::before { background:linear-gradient(135deg,#2563EB 0%,#60a5fa 100%); }
  .tile.t2::before { background:linear-gradient(135deg,#0D9488 0%,#5eead4 100%); }
  .tile.t3::before { background:linear-gradient(135deg,#7C3AED 0%,#c4b5fd 100%); }
  .tile.t4 { background:#ffffff; align-items:center; justify-content:center; }
  .tile.t4 .plus { font-size:36px; color:#0D9488; font-weight:600; font-family:'Space Grotesk',sans-serif; }
  .tile .cap {
    position:relative; z-index:1; font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,0.92);
    letter-spacing:0.05em; padding:8px 10px;
  }
  .res-badge {
    position:absolute; top:96px; right:64px; transform:translateY(-100%);
    background:#18181b; color:#faf9f5; border-radius:10px; padding:10px 16px;
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; letter-spacing:0.03em;
    display:flex; flex-direction:column; gap:4px; text-align:right;
  }
  .res-badge .row span { color:#5eead4; }

  .bottom { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; }
  .chips { display:flex; gap:14px; align-items:center; }
  .chip {
    background:#ffffff; border:1.5px solid #e4e4e7; border-radius:50px; padding:13px 26px;
    font-size:22px; font-weight:600; color:#18181b;
  }
  .chip.accent { border-color:rgba(13,148,136,0.40); color:#0D9488; background:#f0fdfa; font-family:'JetBrains Mono',monospace; font-size:18px; }
  .arrow { font-size:26px; color:#a1a1aa; }

  .brand { display:flex; align-items:center; gap:13px; }
  .brand span { font-size:23px; font-weight:600; color:#52525b; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>
  <div class="wash2"></div>

  <div class="res-badge">
    <div class="row">GEN <span>4096&times;4096</span></div>
    <div class="row">EDIT <span>2048&times;2048</span></div>
  </div>
  <div class="mosaic">
    <div class="tile t1"><span class="cap">generate</span></div>
    <div class="tile t2"><span class="cap">edit</span></div>
    <div class="tile t3"><span class="cap">reference</span></div>
    <div class="tile t4"><span class="plus">&times;9</span></div>
  </div>

  <div class="content">
    <div class="kicker">Alibaba &middot; Wan 2.7 Image Pro &middot; on Token Station</div>
    <h1>Prompts in.<br><span class="hl">4K images</span> out.
      <span class="sub">Generation and editing, one API.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">text-to-image</div>
        <div class="chip">editing</div>
        <div class="arrow">&rarr;</div>
        <div class="chip accent">qwen/wan-2.7-image-pro</div>
      </div>
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"/>
          <circle cx="12" cy="16" r="3.4" fill="#2563EB"/>
          <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"/>
          <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>ByteFuture</span>
      </div>
    </div>
  </div>
</body>
</html>

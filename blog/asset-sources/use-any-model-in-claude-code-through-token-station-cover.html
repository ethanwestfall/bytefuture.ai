<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="_cover.css">
<style>
  /* This cover leads with ByteFuture blue rather than the default teal. */
  :root {
    --accent: #2563EB;
    --accent-soft: rgba(37, 99, 235, 0.40);
    --accent-bg: #eff4ff;
    --wash-1: rgba(37, 99, 235, 0.16);
    --wash-2: rgba(13, 148, 136, 0.08);
  }

  /* Claude Code slot -> Token Station model, upper right. */
  .rows { position: absolute; right: 70px; top: 112px; width: 460px; }
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .row .slot {
    background: #ffffff; border: 1.5px solid var(--line); border-radius: 50px; padding: 11px 24px;
    font-size: 20px; font-weight: 600; color: var(--ink); width: 118px; text-align: center;
  }
  .row .arrow { font-size: 22px; }
  .row .model {
    background: #f0fdfa; border: 1.5px solid rgba(13, 148, 136, 0.40); border-radius: 50px; padding: 11px 22px;
    font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #0D9488;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wash"></div>

  <div class="rows">
    <div class="row"><div class="slot">Opus</div><div class="arrow">&rarr;</div><div class="model">openai/gpt-5.5</div></div>
    <div class="row"><div class="slot">Sonnet</div><div class="arrow">&rarr;</div><div class="model">openai/gpt-5.4-mini</div></div>
    <div class="row"><div class="slot">Haiku</div><div class="arrow">&rarr;</div><div class="model">openai/gpt-5.4-nano</div></div>
  </div>

  <div class="content">
    <div class="kicker">Claude Code &middot; Token Station &middot; Any model</div>
    <h1>Same harness.<br>Any model.
      <span class="sub">No wrapper, no proxy, just Token Station.</span>
    </h1>

    <div class="bottom">
      <div class="chips">
        <div class="chip">Opus</div>
        <div class="chip">Sonnet</div>
        <div class="chip">Haiku</div>
        <div class="chip accent">on Token Station</div>
      </div>
      <div class="brand"><span>ByteFuture</span></div>
    </div>
  </div>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>genoffice-meets-token-station-cover</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@1,8..60,400&amp;display=swap');
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.2" fill="rgb(24,24,27)" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="wash1" gradientUnits="userSpaceOnUse" cx="1040" cy="120" r="480.83">
      <stop offset="0" stop-color="rgb(37,99,235)" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="rgb(13,148,136)" stop-opacity="0.1"/>
      <stop offset="0.7" stop-color="rgb(0,0,0)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" gradientUnits="userSpaceOnUse" cx="140" cy="590" r="424.26">
      <stop offset="0" stop-color="rgb(13,148,136)" stop-opacity="0.1"/>
      <stop offset="0.65" stop-color="rgb(0,0,0)" stop-opacity="0"/>
    </radialGradient>
    <filter id="tileShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="rgb(24,24,27)" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="lgDocs" gradientUnits="userSpaceOnUse" x1="757.25" y1="110.75" x2="907.75" y2="261.25">
      <stop offset="0" stop-color="rgb(37,99,235)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(96,165,250)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lgSheets" gradientUnits="userSpaceOnUse" x1="964.25" y1="110.75" x2="1114.75" y2="261.25">
      <stop offset="0" stop-color="rgb(13,148,136)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(94,234,212)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lgSlides" gradientUnits="userSpaceOnUse" x1="757.25" y1="236.75" x2="907.75" y2="387.25">
      <stop offset="0" stop-color="rgb(124,58,237)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(196,181,253)" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lgPdf" gradientUnits="userSpaceOnUse" x1="964.25" y1="236.75" x2="1114.75" y2="387.25">
      <stop offset="0" stop-color="rgb(245,158,11)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(252,211,77)" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="genofficeIconClip">
      <rect width="240" height="240" fill="white"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="rgb(250,249,245)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>
  <rect x="700" y="-220" width="680" height="680" fill="url(#wash1)"/>
  <rect x="-160" y="290" width="600" height="600" fill="url(#wash2)"/>

  <!-- top-right badge: what's in the suite -->
  <rect x="887" y="85" width="248" height="32" rx="8" fill="rgb(24,24,27)"/>
  <text x="900" y="106" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.36px" fill="rgb(250,249,245)">DOCS · SHEETS · SLIDES · PDF</text>

  <!-- app tile mosaic -->
  <rect x="736.5" y="130.5" width="192" height="111" rx="14" fill="none" stroke="rgb(228,228,231)" stroke-width="1" filter="url(#tileShadow)"/>
  <rect x="737" y="131" width="191" height="110" rx="13" fill="url(#lgDocs)"/>
  <text x="747" y="230" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.6px" fill="rgba(255,255,255,0.95)">Docs</text>

  <rect x="943.5" y="130.5" width="192" height="111" rx="14" fill="none" stroke="rgb(228,228,231)" stroke-width="1" filter="url(#tileShadow)"/>
  <rect x="944" y="131" width="191" height="110" rx="13" fill="url(#lgSheets)"/>
  <text x="954" y="230" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.6px" fill="rgba(255,255,255,0.95)">Sheets</text>

  <rect x="736.5" y="256.5" width="192" height="111" rx="14" fill="none" stroke="rgb(228,228,231)" stroke-width="1" filter="url(#tileShadow)"/>
  <rect x="737" y="257" width="191" height="110" rx="13" fill="url(#lgSlides)"/>
  <text x="747" y="356" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.6px" fill="rgba(255,255,255,0.95)">Slides</text>

  <rect x="943.5" y="256.5" width="192" height="111" rx="14" fill="none" stroke="rgb(228,228,231)" stroke-width="1" filter="url(#tileShadow)"/>
  <rect x="944" y="257" width="191" height="110" rx="13" fill="url(#lgPdf)"/>
  <text x="954" y="356" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.6px" fill="rgba(255,255,255,0.95)">PDF</text>

  <!-- kicker: GenOffice icon + product line -->
  <svg x="72" y="44" width="36" height="36" viewBox="0 0 240 240">
    <g clip-path="url(#genofficeIconClip)">
      <rect width="240" height="240" rx="54" fill="rgb(24,24,27)"/>
      <rect x="51" y="46" width="90" height="108" rx="16" fill="white"/>
      <rect x="99" y="86" width="90" height="108" rx="16" fill="white"/>
      <path d="M99 102C99 93.1634 106.163 86 115 86H141V138C141 146.837 133.837 154 125 154H99V102Z" fill="rgb(24,24,27)"/>
    </g>
  </svg>
  <text x="118" y="72" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="600" letter-spacing="2.72px" fill="rgb(37,99,235)">GENOFFICE · TOKEN STATION · PRODUCT INTEGRATION</text>

  <!-- headline -->
  <text x="72" y="172" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" letter-spacing="-2.38px" fill="rgb(24,24,27)">Any model.</text>
  <text x="72" y="245.44" font-family="'Space Grotesk', sans-serif" font-size="68" font-weight="700" letter-spacing="-2.38px" fill="rgb(37,99,235)">Pay-as-you-go.</text>
  <text x="72" y="308.88" font-family="'Source Serif 4', serif" font-size="32" font-weight="400" font-style="italic" letter-spacing="-0.32px" fill="rgb(82,82,91)">GenOffice, powered by Token Station.</text>

  <!-- bottom chips -->
  <rect x="72.5" y="510.5" width="112" height="55" rx="27.5" fill="rgb(255,255,255)" stroke="rgb(228,228,231)" stroke-width="1"/>
  <text x="99" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24,24,27)">Docs</text>

  <rect x="198.5" y="510.5" width="136" height="55" rx="27.5" fill="rgb(255,255,255)" stroke="rgb(228,228,231)" stroke-width="1"/>
  <text x="223" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24,24,27)">Sheets</text>

  <rect x="348.5" y="510.5" width="136" height="55" rx="27.5" fill="rgb(255,255,255)" stroke="rgb(228,228,231)" stroke-width="1"/>
  <text x="373" y="546" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="rgb(24,24,27)">Slides</text>

  <text x="500" y="547" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="400" fill="rgb(161,161,170)">→</text>

  <rect x="540" y="513" width="206" height="50" rx="25" fill="rgb(239,246,255)" stroke="rgba(37,99,235,0.4)" stroke-width="1"/>
  <text x="566.5" y="544.5" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="rgb(37,99,235)">token station</text>

  <!-- ByteFuture brand lockup -->
  <svg x="949.08" y="526" width="40" height="40" viewBox="0 0 32 32" fill="none">
    <rect x="2.5" y="2.5" width="27" height="27" rx="8" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="1.6"></rect>
    <circle cx="12" cy="16" r="3.4" fill="#2563EB"></circle>
    <circle cx="21.5" cy="16" r="3.4" fill="none" stroke="#0D9488" stroke-width="1.8"></circle>
    <path d="M15.4 16h2.7" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round"></path>
  </svg>
  <text x="1002.08" y="554" font-family="'Space Grotesk', sans-serif" font-size="23" font-weight="600" fill="rgb(82,82,91)">ByteFuture</text>
</svg>

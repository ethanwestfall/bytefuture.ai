  <!-- ─── i18n: remember language choice + auto-redirect; toggle lives in the nav (see CLAUDE.md) ─── -->
  <script>
  (function () {
    var LANGS = ['en', 'zh', 'ja', 'ko'];
    var path = location.pathname, slash = path.lastIndexOf('/');
    var dir = path.slice(0, slash + 1), file = path.slice(slash + 1) || 'index.html';
    var m = file.match(/^(.*?)(?:-(zh|ja|ko))?\.html$/i);
    var base = m ? m[1] : file.replace(/\.html$/i, '');
    var cur = (m && m[2]) ? m[2] : 'en';
    function target(l) { return dir + base + (l === 'en' ? '' : '-' + l) + '.html' + location.search + location.hash; }
    function cookie() { var h = document.cookie.match(/(?:^|;\s*)bf_lang=([^;]+)/); return h ? decodeURIComponent(h[1]) : ''; }
    window.bfLang = {
      cur: cur,
      pick: function (l) {
        if (LANGS.indexOf(l) === -1) return;
        document.cookie = 'bf_lang=' + l + ';path=/;max-age=31536000;samesite=lax';
        if (l !== cur) location.href = target(l);
      }
    };
    var pref = cookie();
    if (LANGS.indexOf(pref) === -1) {
      pref = 'en';
      var navs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < navs.length; i++) {
        var c = (navs[i] || '').slice(0, 2).toLowerCase();
        if (c === 'zh' || c === 'ja' || c === 'ko' || c === 'en') { pref = c; break; }
      }
    }
    if (pref !== cur) { location.replace(target(pref)); }
    document.addEventListener('DOMContentLoaded', function () {
      var s = document.querySelector('select[data-bf-lang]');
      if (s) s.value = cur;
    });
  })();
  </script>

  <style>

    /* Animate on scroll */
    .animate-on-scroll { opacity: 0; transform: translateY(24px); transition: opacity 0.6s ease, transform 0.6s ease; }

    /* Grid */

<!-- ─── SCROLL REVEAL ─── -->
<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });
document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
</script>

<!-- ─── POSTS ENGINE ─── -->
<script>
(function() {
  var POSTS_PER_PAGE = 6;
  var allPosts = [];
  var filtered = [];
  var shown = 0;
  var activeCat = 'all';

  // ─── i18n: this page's language drives the data file, article links, and labels ───
  var LANG = (window.bfLang && window.bfLang.cur) || 'en';
  var SUF = LANG === 'en' ? '' : '-' + LANG;
  var POSTS_URL = LANG === 'en' ? '/posts.json' : '/posts-' + LANG + '.json';
  var DATE_LOCALE = { en: 'en-US', zh: 'zh-CN', ja: 'ja-JP', ko: 'ko-KR' }[LANG] || 'en-US';
  var CAT_LABELS = {
    en: { engineering: 'Engineering', product: 'Product', research: 'Research', tutorial: 'Tutorial' },
    zh: { engineering: '工程', product: '产品', research: '研究', tutorial: '教程' },
    ja: { engineering: 'エンジニアリング', product: 'プロダクト', research: '研究', tutorial: 'チュートリアル' },
    ko: { engineering: '엔지니어링', product: '제품', research: '연구', tutorial: '튜토리얼' }
  };
  var T = {
    readArticle: ({ en: 'Read article', zh: '阅读全文', ja: '記事を読む', ko: '글 읽기' })[LANG] || 'Read article',
    featured: ({ en: 'Featured', zh: '精选', ja: '注目', ko: '추천' })[LANG] || 'Featured'
  };

  function formatDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(DATE_LOCALE, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function catLabel(cat) { return (CAT_LABELS[LANG] && CAT_LABELS[LANG][cat]) || (cat.charAt(0).toUpperCase() + cat.slice(1)); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  // Cover paths in posts.json are repo-root-relative (e.g. "blog/foo.png"); make them absolute.
  function coverUrl(c) { return c.charAt(0) === '/' ? c : '/' + c; }

  // Category-based gradient backgrounds
  var catGradients = {
    research:    'linear-gradient(135deg,rgba(13,148,136,0.08) 0%,rgba(124,58,237,0.08) 100%)',
    engineering: 'linear-gradient(135deg,#f4f4f5 0%,#e4e4e7 100%)',
    tutorial:    'linear-gradient(135deg,rgba(37,99,235,0.06) 0%,rgba(13,148,136,0.06) 100%)',
    product:     'linear-gradient(135deg,rgba(37,99,235,0.04) 0%,rgba(124,58,237,0.04) 100%)'
  };

  function renderFeatured(post) {
    var section = document.getElementById('featured-section');
    if (!post) { section.innerHTML = ''; return; }
    // Cover image when the post has one; gradient fallback otherwise.
    var media = post.cover
      ? '<img src="' + esc(coverUrl(post.cover)) + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;">'
      : '<div style="position:absolute;inset:0;background:linear-gradient(135deg,#2563EB 0%,#0D9488 60%,#7C3AED 100%);display:flex;align-items:center;justify-content:center;">' +
          '<svg width="120" height="120" viewBox="0 0 120 120" fill="none" style="opacity:0.15;"><circle cx="60" cy="60" r="50" stroke="#fff" stroke-width="2"/><path d="M40 60L55 75L80 45" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div>';
    section.innerHTML =
      '<a href="/blog/' + encodeURIComponent(post.slug) + SUF + '.html" style="text-decoration:none;color:inherit;" onclick="gtag(\'event\',\'blog_click\',{label:\'featured\'})">' +
        '<article class="featured-card animate-on-scroll">' +
          '<div class="featured-inner" style="display:flex;">' +
            '<div style="width:50%;aspect-ratio:1200/630;align-self:flex-start;position:relative;overflow:hidden;background:#faf9f5;" class="featured-cover">' +
              media +
              '<div style="position:absolute;bottom:24px;left:24px;"><span style="font-size:11px;font-family:\'JetBrains Mono\',monospace;color:#ffffff;letter-spacing:0.1em;text-transform:uppercase;background:rgba(24,24,27,0.55);padding:4px 10px;border-radius:50px;">' + T.featured + '</span></div>' +
            '</div>' +
            '<div style="width:50%;padding:40px;">' +
              '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">' +
                '<span class="post-tag">' + catLabel(post.category) + '</span>' +
                '<time style="font-size:13px;color:#a1a1aa;font-family:\'Space Grotesk\',sans-serif;">' + formatDate(post.date) + '</time>' +
              '</div>' +
              '<h2 style="font-family:\'Space Grotesk\',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;margin:0 0 16px;">' + esc(post.title) + '</h2>' +
              '<p style="font-size:17px;color:#52525b;line-height:1.7;margin:0 0 24px;">' + esc(post.summary) + '</p>' +
              '<span style="font-family:\'Space Grotesk\',sans-serif;font-size:14px;font-weight:600;color:#2563EB;">' + T.readArticle + ' &rarr;</span>' +
            '</div>' +
          '</div>' +
        '</article>' +
      '</a>';
    observeNew();
  }

  function renderCard(post) {
    var bg = catGradients[post.category] || catGradients.product;
    var coverHtml = post.cover
      ? '<div style="aspect-ratio:1200/630;overflow:hidden;background:#faf9f5;"><img src="' + esc(coverUrl(post.cover)) + '" alt="" style="width:100%;height:100%;object-fit:contain;display:block;"></div>'
      : '<div style="height:180px;background:' + bg + ';display:flex;align-items:center;justify-content:center;">' +
          '<svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="opacity:0.18;"><rect x="4" y="8" width="32" height="24" rx="4" stroke="#18181b" stroke-width="2"/><path d="M12 16H28M12 22H22" stroke="#18181b" stroke-width="2" stroke-linecap="round"/></svg>' +
        '</div>';
    return '<a href="/blog/' + encodeURIComponent(post.slug) + SUF + '.html" style="text-decoration:none;color:inherit;" class="animate-on-scroll" onclick="gtag(\'event\',\'blog_click\',{label:\'' + esc(post.slug) + '\'})">' +
      '<article class="post-card" data-cat="' + esc(post.category) + '">' +
        coverHtml +
        '<div class="post-card-body">' +
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">' +
            '<span class="post-tag">' + catLabel(post.category) + '</span>' +
            '<time style="font-size:13px;color:#a1a1aa;font-family:\'Space Grotesk\',sans-serif;">' + formatDate(post.date) + '</time>' +
          '</div>' +
          '<h3 style="font-family:\'Space Grotesk\',sans-serif;font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.3;margin:0 0 8px;">' + esc(post.title) + '</h3>' +
          '<p style="font-size:15px;color:#52525b;line-height:1.65;margin:0;">' + esc(post.summary) + '</p>' +
        '</div>' +
      '</article>' +
    '</a>';
  }

  function renderGrid() {
    var grid = document.getElementById('posts-grid');
    var batch = filtered.slice(shown, shown + POSTS_PER_PAGE);
    var html = '';
    batch.forEach(function(p) { html += renderCard(p); });
    if (shown === 0) { grid.innerHTML = html; } else { grid.insertAdjacentHTML('beforeend', html); }
    shown += batch.length;
    var wrap = document.getElementById('load-more-wrap');
    wrap.style.display = (shown < filtered.length) ? '' : 'none';
    observeNew();
  }

  function applyFilter(cat) {
    activeCat = cat;
    shown = 0;
    // allPosts is sorted newest-first; the latest post always leads as the hero.
    if (cat === 'all') {
      renderFeatured(allPosts[0] || null);
      filtered = allPosts.slice(1);
    } else {
      renderFeatured(null);
      filtered = allPosts.filter(function(p) { return p.category === cat; });
    }
    filtered.sort(function(a, b) { return b.date.localeCompare(a.date); });
    renderGrid();
  }

  function observeNew() {
    document.querySelectorAll('.animate-on-scroll:not(.is-visible)').forEach(function(el) { observer.observe(el); });
  }

  function setActivePill(cat) {
    var pills = document.querySelectorAll('#cat-filter .cat-pill');
    pills.forEach(function(p) { p.classList.toggle('active', p.getAttribute('data-cat') === cat); });
  }

  // Filter pills
  var pills = document.querySelectorAll('#cat-filter .cat-pill');
  pills.forEach(function(pill) {
    pill.addEventListener('click', function() {
      setActivePill(pill.getAttribute('data-cat'));
      applyFilter(pill.getAttribute('data-cat'));
      gtag('event', 'blog_filter', { label: pill.getAttribute('data-cat') });
    });
  });

  // Load more
  document.getElementById('load-more-btn').addEventListener('click', function() {
    renderGrid();
    gtag('event', 'blog_load_more', { label: 'page_' + Math.ceil(shown / POSTS_PER_PAGE) });
  });

  // Fetch posts (per-language manifest when not English)
  fetch(POSTS_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allPosts = data.sort(function(a, b) { return b.date.localeCompare(a.date); });
      // Deep-link: /blog/?cat=research selects that category on load.
      var validCats = { all:1, engineering:1, product:1, research:1, tutorial:1 };
      var params = new URLSearchParams(location.search);
      var startCat = params.get('cat');
      if (!startCat || !validCats[startCat]) startCat = 'all';
      setActivePill(startCat);
      applyFilter(startCat);
    });
})();
</script>

<!-- ─── SCROLL EVENTS ─── -->
<script>
// scroll_50 engagement event
(function() {
  var fired = false;
  window.addEventListener('scroll', function() {
    if (fired) return;
    var scrollPercent = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight;
    if (scrollPercent >= 0.5) {
      fired = true;
      gtag('event', 'scroll', {percent_scrolled: 50});
    }
  });
})();
</script>

name: Blog framework

on:
  pull_request:
    paths:
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'
      - 'blog/**'
      - 'posts*.json'
      - '.github/workflows/blog-framework.yml'
  push:
    # Any push to main redeploys the whole site (Astro build of dist/),
    # so root chrome like index*.html / sitemap.xml / CNAME is picked up too.
    branches:
      - main

# GITHUB_TOKEN defaults; the deploy job widens its own permissions below.
permissions:
  contents: read

# Never run two Pages deployments at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro static site
        run: npm run build

      - name: Check legacy .html links are preserved
        run: npm run check:legacy-links

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 8770 > /tmp/bytefuture-preview.log 2>&1 &
          echo $! > /tmp/bytefuture-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8770/blog/try-claude-fable-5-in-codex-openclaw-and-pi.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bytefuture-preview.log
          exit 1

      - name: Smoke test old and new URLs
        run: |
          set -euo pipefail
          for url in \
            http://127.0.0.1:8770/blog/try-claude-fable-5-in-codex-openclaw-and-pi.html \
            http://127.0.0.1:8770/blog/try-claude-fable-5-in-codex-openclaw-and-pi-zh.html \
            http://127.0.0.1:8770/blog/american-open-models-catching-up-nemotron-gpt55.html \
            http://127.0.0.1:8770/blog/use-token-station-in-cc-switch-for-claude-desktop-zh.html \
            http://127.0.0.1:8770/posts.json; do
            code=$(curl -fsS -o /tmp/bytefuture-url-check.out -w '%{http_code}' "$url")
            test "$code" = "200"
            echo "$url -> $code"
          done

      - name: Check 375px mobile width
        env:
          CHROME_PATH: google-chrome-stable
        run: npm run check:mobile -- http://127.0.0.1:8770/blog/try-claude-fable-5-in-codex-openclaw-and-pi.html

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/bytefuture-preview.pid ]; then
            kill "$(cat /tmp/bytefuture-preview.pid)" || true
          fi

  # Publish the Astro build (dist/) to GitHub Pages on every push to main.
  # Requires the repo's Pages source to be set to "GitHub Actions".
  deploy:
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
